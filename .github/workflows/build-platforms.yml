name: Check shared Windows and Linux source
on:
  workflow_dispatch:
  push:
    branches: ['codex/linux-flatpak']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Python protocol and routing regressions
        shell: bash
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -q
      - name: Compile Windows Java app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -OutputName internal/MultiMini-Windows-Check.jar
      - name: Install Linux native build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ libx11-dev libxt-dev
      - name: Compile Linux Java app
        if: runner.os == 'Linux'
        run: ./scripts/build-linux.sh
      - name: Shared UI contrast and policy check
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/checks
          javac --release 25 -cp build/internal/MultiMini-Linux.jar -d build/checks app/src/test/java/app/multimin/ui/AppearancePolicyCheck.java
          java -Djava.awt.headless=true -cp build/checks:build/internal/MultiMini-Linux.jar app.multimin.ui.AppearancePolicyCheck
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.openjdk25//25.08
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-flatpak-preview
          path: dist/*.flatpak*
