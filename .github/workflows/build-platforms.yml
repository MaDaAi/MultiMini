name: Check shared Windows, Linux and macOS source
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Python protocol and routing regressions
        shell: bash
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -q
      - name: Compile Windows Java app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -OutputName internal/MultiMini-Windows-Check.jar
      - name: Install Linux native build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ libx11-dev libxt-dev
      - name: Compile Linux Java app
        if: runner.os == 'Linux'
        run: ./scripts/build-linux.sh
      - name: Compile macOS Java app
        if: runner.os == 'macOS'
        run: ./scripts/build-mac.sh
      - name: Frame transport check (socket and shared memory)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PYTHONPATH: python
        run: |
          jar=build/internal/MultiMini-Linux.jar
          [ "$RUNNER_OS" = macOS ] && jar=build/internal/MultiMini-Mac.jar
          mkdir -p build/checks
          javac --release 25 -cp "$jar" -d build/checks native/tests/FrameBridgeCheck.java
          python scripts/check-frame-bridge.py "$jar" build/checks
      - name: Shared UI contrast and policy check
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/checks
          javac --release 25 -cp build/internal/MultiMini-Linux.jar -d build/checks app/src/test/java/app/multimin/ui/AppearancePolicyCheck.java
          java -Djava.awt.headless=true -cp build/checks:build/internal/MultiMini-Linux.jar app.multimin.ui.AppearancePolicyCheck
  linux-benchmark:
    # Manual only: measures the X11 capture pipeline under Xvfb and uploads the results.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install X server, compositor and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libx11-dev libxt-dev xvfb xcompmgr x11-utils dbus python3-xlib python3-gi gir1.2-gst-plugins-base-1.0 gstreamer1.0-pipewire
      - run: ./scripts/build-linux.sh
      - name: Run pipeline benchmark
        run: dbus-run-session -- /usr/bin/python3 scripts/benchmark-linux.py run --jar build/internal/MultiMini-Linux.jar --out build/bench
      - name: Publish summary
        if: always()
        run: '[ -f build/bench/results.md ] && cat build/bench/results.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-benchmark-results
          path: build/bench/results.*
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.openjdk25//25.08
      - name: Import repository signing key (release bundles must be signed)
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then echo "No signing key: unsigned preview bundle"; exit 0; fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 -p "$GNUPGHOME"
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "FLATPAK_GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY_ID=48EE2A545E12328FF86A7E1E2559C6CB1D3E27F2" >> "$GITHUB_ENV"
      - run: ./scripts/package-linux.sh
      - name: Install the bundle the way users do (catches signing problems)
        run: |
          flatpak --user install -y --noninteractive dist/*.flatpak
          flatpak --user info io.github.MaDaAi.MultiMini
          flatpak --user remotes -d
      - name: Update check from inside the sandbox
        run: flatpak run --user io.github.MaDaAi.MultiMini --check-updates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-flatpak-preview
          path: dist/*.flatpak*
  macos:
    # Untested preview: packaged on Apple Silicon. Signs ad-hoc unless the
    # optional Developer ID secrets below exist (see docs/MACOS.md).
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Import Developer ID certificate (only when secrets exist)
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p temp "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p temp "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k temp "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Package macOS app
        run: ./scripts/package-mac.sh
      - name: Smoke-test macOS backend with bundled Python
        run: build/mac/input/python/runtime/bin/python3 scripts/check-mac-backend.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg-preview
          path: dist/*.dmg*
