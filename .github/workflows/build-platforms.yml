name: Check shared Windows, Linux and macOS source
on:
  workflow_dispatch:
  push:
    branches: ['codex/linux-flatpak']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Python protocol and routing regressions
        shell: bash
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -q
      - name: Compile Windows Java app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -OutputName internal/MultiMini-Windows-Check.jar
      - name: Install Linux native build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ libx11-dev libxt-dev
      - name: Compile Linux Java app
        if: runner.os == 'Linux'
        run: ./scripts/build-linux.sh
      - name: Compile macOS Java app
        if: runner.os == 'macOS'
        run: ./scripts/build-mac.sh
      - name: Shared UI contrast and policy check
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/checks
          javac --release 25 -cp build/internal/MultiMini-Linux.jar -d build/checks app/src/test/java/app/multimin/ui/AppearancePolicyCheck.java
          java -Djava.awt.headless=true -cp build/checks:build/internal/MultiMini-Linux.jar app.multimin.ui.AppearancePolicyCheck
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.openjdk25//25.08
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-flatpak-preview
          path: dist/*.flatpak*
  macos:
    # Untested preview: packaged on Apple Silicon. Signs ad-hoc unless the
    # optional Developer ID secrets below exist (see docs/MACOS.md).
    runs-on: macos-14
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Import Developer ID certificate (only when secrets exist)
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p temp "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p temp "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k temp "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Package macOS app
        run: ./scripts/package-mac.sh
      - name: Smoke-test macOS backend with bundled Python
        run: build/mac/input/python/runtime/bin/python3 scripts/check-mac-backend.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg-preview
          path: dist/*.dmg*
